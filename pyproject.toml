[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "choose-adventure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=5",
    "openai>=1.68",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
saga = "choose_adventure.main:main"
saga-server = "choose_adventure.server.main:main"
saga-client = "choose_adventure.client.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "basedpyright",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: live LLM endpoint (network required)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: Depends()/Header() in argument defaults is the framework contract.
"src/choose_adventure/server/app.py" = ["B008"]

[tool.basedpyright]
typeCheckingMode = "standard"
