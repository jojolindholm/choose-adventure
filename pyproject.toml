[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "choose-adventure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "textual>=5",
    "openai>=1.68",
    "pydantic>=2",
]

[project.scripts]
cya = "choose_adventure.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "basedpyright",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: live LLM endpoint (network required)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.basedpyright]
typeCheckingMode = "standard"
